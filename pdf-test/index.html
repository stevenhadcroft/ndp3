<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #1e1e1e;
      color: #ccc;
      font-family: sans-serif;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #2d2d2d;
      border-bottom: 1px solid #444;
      flex-shrink: 0;
    }

    #pdf-title {
      font-size: 13px;
      color: #aaa;
    }

    #page-info {
      margin-left: auto;
      font-size: 13px;
      color: #888;
    }

    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Thumbnail sidebar */
    #sidebar {
      width: 160px;
      flex-shrink: 0;
      background: #252525;
      border-right: 1px solid #444;
      overflow-y: auto;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #sidebar::-webkit-scrollbar { width: 6px; }
    #sidebar::-webkit-scrollbar-track { background: transparent; }
    #sidebar::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

    .thumbnail-wrapper {
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 4px;
      overflow: hidden;
      transition: border-color 0.15s;
      position: relative;
    }

    .thumbnail-wrapper:hover { border-color: #888; }
    .thumbnail-wrapper.active { border-color: #4a9eff; }

    .thumbnail-wrapper canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .thumb-label {
      text-align: center;
      font-size: 10px;
      color: #777;
      padding: 2px 0 3px;
      background: #252525;
    }

    /* Main page view */
    #viewer {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
      background: #1e1e1e;
    }

    #viewer::-webkit-scrollbar { width: 8px; height: 8px; }
    #viewer::-webkit-scrollbar-track { background: transparent; }
    #viewer::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

    #main-canvas {
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
      background: white;
      display: block;
    }

    #placeholder {
      color: #555;
      font-size: 15px;
      margin-top: 80px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <span id="pdf-title">NDP3 Articulogram worksheets</span>
    <span id="page-info"></span>
  </div>

  <div id="main">
    <div id="sidebar"></div>
    <div id="viewer">
      <p id="placeholder">Open a PDF to get started</p>
      <canvas id="main-canvas" style="display:none;"></canvas>
    </div>
  </div>

  <!-- PDF.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    const sidebar     = document.getElementById('sidebar');
    const mainCanvas  = document.getElementById('main-canvas');
    const placeholder = document.getElementById('placeholder');
    const pageInfo    = document.getElementById('page-info');
    const ctx         = mainCanvas.getContext('2d');

    let pdfDoc       = null;
    let currentPage  = 1;
    const THUMB_W    = 140; // px — thumbnail render width
    const MAIN_SCALE = 1.5; // scale for main view

    async function loadPDF(url) {
      pdfDoc = await pdfjsLib.getDocument(url).promise;

      sidebar.innerHTML = '';
      placeholder.style.display = 'none';
      mainCanvas.style.display  = 'block';

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        await renderThumbnail(i);
      }

      showPage(1);
    }

    loadPDF('docs/NDP3 Articulogram worksheets.pdf');

    async function renderThumbnail(pageNum) {
      const page     = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1 });
      const scale    = THUMB_W / viewport.width;
      const scaled   = page.getViewport({ scale });

      const canvas  = document.createElement('canvas');
      canvas.width  = scaled.width;
      canvas.height = scaled.height;

      await page.render({ canvasContext: canvas.getContext('2d'), viewport: scaled }).promise;

      const wrapper = document.createElement('div');
      wrapper.className = 'thumbnail-wrapper';
      wrapper.dataset.page = pageNum;
      wrapper.appendChild(canvas);

      const label = document.createElement('div');
      label.className = 'thumb-label';
      label.textContent = pageNum;
      wrapper.appendChild(label);

      wrapper.addEventListener('click', () => showPage(pageNum));
      sidebar.appendChild(wrapper);
    }

    async function showPage(pageNum) {
      currentPage = pageNum;

      // Highlight active thumbnail
      document.querySelectorAll('.thumbnail-wrapper').forEach(el => {
        el.classList.toggle('active', Number(el.dataset.page) === pageNum);
      });

      // Scroll thumbnail into view
      const activeThumb = sidebar.querySelector(`[data-page="${pageNum}"]`);
      if (activeThumb) activeThumb.scrollIntoView({ block: 'nearest' });

      // Render main page
      const page     = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: MAIN_SCALE });

      mainCanvas.width  = viewport.width;
      mainCanvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport }).promise;

      pageInfo.textContent = `Page ${pageNum} of ${pdfDoc.numPages}`;
    }
  </script>
</body>
</html>
