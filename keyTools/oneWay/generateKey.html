<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate Key</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            background: #011a3f;
            color: #ffffff;
            box-sizing: border-box;
        }
        .panel {
            background: #012457;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            width: 400px;
        }
        h1 { margin: 0 0 32px; font-size: 22px; font-weight: 600; color: #ffffff; }
        label { display: block; margin-bottom: 12px; font-size: 14px; font-weight: 500; color: #ffffff; }
        input {
            font-size: 18px;
            padding: 12px 14px;
            border-radius: 6px;
            border: 0;
            background: #ffffff;
            color: #012457;
            box-sizing: border-box;
            width: 100%;
            font-family: inherit;
            margin-bottom: 28px;
        }
        input::placeholder { color: #295b88aa; }
        input:focus { outline: 2px solid #ffcc00; outline-offset: 0; }
        button {
            cursor: pointer;
            background: #2c83d4;
            border: 0;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            padding: 14px 14px;
            border-radius: 99px;
            box-sizing: border-box;
            width: 100%;
            font-family: inherit;
            transition: background-color 120ms ease;
        }
        button:hover { background: #1d77c9; }
        button:active { background: #0F6ACB; }
        .output {
            margin-top: 44px;
            padding: 12px;
            background: #295b88;
            border: 1px solid #ffcc00;
            border-radius: 6px;
            font-family: "Menlo", monospace;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 3px;
            text-align: center;
            min-height: 26px;
            user-select: all;
            word-break: break-all;
            color: #ffcc00;
        }
        .meta { margin-top: 14px; font-size: 13px; color: #ffffff; text-align: center; word-break: break-all; }
        .bad { color: #ffcc00; font-weight: 600; }
        .link { display: block; margin-top: 32px; text-align: center; font-size: 14px; }
        .link a { color: #ffcc00; text-decoration: none; font-weight: 500; }
        .link a:hover { text-decoration: underline; }
        .link + .link { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Generate Key</h1>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="user@example.com" autocomplete="off" />
        <button id="generate">Generate Key</button>
        <div class="output" id="output">—</div>
        <div class="meta" id="meta"></div>
        <div class="link"><a href="validateKey.html">Validate a key →</a></div>
        <div class="link"><a href="decodeKey.html">Decode a key →</a></div>
    </div>

    <script>
        // Must match src/utils.js — keep these in sync.
        const KEY_SECRET = "ndp3-key-v1-7a2c9f3e8d4b6105";
        const BASE32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

        const normalizeEmail = (email) => String(email || "").trim().toLowerCase();

        const base32Encode = (bytes) => {
            let bits = 0, value = 0, out = "";
            for (const b of bytes) {
                value = (value << 8) | b;
                bits += 8;
                while (bits >= 5) {
                    out += BASE32[(value >> (bits - 5)) & 31];
                    bits -= 5;
                }
            }
            if (bits > 0) out += BASE32[(value << (5 - bits)) & 31];
            return out;
        };

        const hmacSha256 = async (secret, data) => {
            const k = await crypto.subtle.importKey(
                "raw", new TextEncoder().encode(secret),
                { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
            );
            return new Uint8Array(await crypto.subtle.sign("HMAC", k, data));
        };

        const computeKeyMac = async (email) => {
            const data = new TextEncoder().encode(normalizeEmail(email));
            return (await hmacSha256(KEY_SECRET, data)).slice(0, 5);
        };

        const generateKey = async (email) => {
            if (!normalizeEmail(email)) throw new Error("email required");
            const encoded = base32Encode(await computeKeyMac(email));
            return `${encoded.slice(0, 4)}-${encoded.slice(4, 8)}`;
        };

        document.getElementById("generate").addEventListener("click", async () => {
            const email = document.getElementById("email").value;
            const out = document.getElementById("output");
            const meta = document.getElementById("meta");
            if (!normalizeEmail(email)) {
                out.textContent = "—";
                meta.innerHTML = `<span class="bad">Enter an email</span>`;
                return;
            }
            const key = await generateKey(email);
            out.textContent = key;
            meta.textContent = `for ${normalizeEmail(email)}`;
        });
    </script>
</body>
</html>
