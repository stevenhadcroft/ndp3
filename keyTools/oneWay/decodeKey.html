<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decode Key</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            background: #011a3f;
            color: #ffffff;
            box-sizing: border-box;
        }
        .panel {
            background: #012457;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            width: 400px;
        }
        h1 { margin: 0 0 32px; font-size: 22px; font-weight: 600; color: #ffffff; }
        label { display: block; margin-bottom: 12px; font-size: 14px; font-weight: 500; color: #ffffff; }
        input {
            font-size: 18px;
            padding: 12px 14px;
            border-radius: 6px;
            border: 0;
            background: #ffffff;
            color: #012457;
            box-sizing: border-box;
            width: 100%;
            font-family: inherit;
        }
        input::placeholder { color: #295b88aa; }
        input:focus { outline: 2px solid #ffcc00; outline-offset: 0; }
        .output {
            margin-top: 44px;
            padding: 12px;
            background: #295b88;
            border: 1px solid #ffffff44;
            border-radius: 6px;
            font-family: "Menlo", monospace;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            text-align: center;
            min-height: 26px;
            user-select: all;
            word-break: break-all;
            color: #ffffff;
        }
        .meta { margin-top: 14px; font-size: 13px; color: #ffffff; text-align: center; word-break: break-all; }
        .bad { color: #ffcc00; font-weight: 600; }
        .link { display: block; margin-top: 32px; text-align: center; font-size: 14px; }
        .link a { color: #ffcc00; text-decoration: none; font-weight: 500; }
        .link a:hover { text-decoration: underline; }
        .link + .link { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Decode Key</h1>
        <label for="key">Key</label>
        <input id="key" placeholder="XXXX-XXXX" autocomplete="off" autofocus />
        <div class="output" id="output">—</div>
        <div class="meta" id="meta"></div>
        <div class="link"><a href="generateKey.html">← Generate a key</a></div>
        <div class="link"><a href="validateKey.html">Validate a key →</a></div>
    </div>

    <script>
        // Must match src/utils.js — keep these in sync.
        const BASE32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
        const EXPECTED_BYTES = 5; // key = base32(HMAC-SHA256(email)) truncated to 5 bytes

        const base32Decode = (str) => {
            const bytes = [];
            let bits = 0, value = 0;
            for (const ch of str.toUpperCase()) {
                const idx = BASE32.indexOf(ch);
                if (idx < 0) continue;
                value = (value << 5) | idx;
                bits += 5;
                if (bits >= 8) {
                    bytes.push((value >> (bits - 8)) & 0xff);
                    bits -= 8;
                }
            }
            return new Uint8Array(bytes);
        };

        const toHex = (bytes) =>
            Array.from(bytes).map((b) => b.toString(16).padStart(2, "0").toUpperCase()).join(" ");

        const key = document.getElementById("key");
        const out = document.getElementById("output");
        const meta = document.getElementById("meta");

        const render = () => {
            const raw = key.value.trim();
            const clean = raw.replace(/[^A-Za-z2-7]/g, "");

            if (!clean) {
                out.textContent = "—";
                meta.textContent = "";
                return;
            }

            const bytes = base32Decode(clean);
            out.textContent = bytes.length ? toHex(bytes) : "—";
            meta.innerHTML = `${bytes.length} byte${bytes.length === 1 ? "" : "s"} decoded from “${clean}”`
                + (bytes.length !== EXPECTED_BYTES
                    ? `<br><span class="bad">Not a valid key — expects ${EXPECTED_BYTES} bytes (8 base32 characters)</span>`
                    : "");
        };

        key.addEventListener("input", render);
        render();
    </script>
</body>
</html>
