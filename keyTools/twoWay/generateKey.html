<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate Key (Two-way)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            background: #011a3f;
            color: #ffffff;
            box-sizing: border-box;
        }
        .panel {
            background: #012457;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            width: 400px;
        }
        .header { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
        h1 { margin: 0; font-size: 22px; font-weight: 600; color: #ffffff; }
        .info-toggle {
            cursor: pointer;
            flex: 0 0 auto;
            width: 22px;
            height: 22px;
            margin: 0;
            padding: 0;
            border-radius: 50%;
            border: 1px solid #cfe3f5;
            background: transparent;
            color: #cfe3f5;
            font: 700 italic 14px Georgia, "Times New Roman", serif;
            line-height: 20px;
            text-align: center;
        }
        .info-toggle:hover { background: #295b88; }
        .info-toggle[aria-expanded="true"] { background: #ffcc00; border-color: #ffcc00; color: #012457; }
        .subtitle { margin: 0 0 32px; font-size: 13px; color: #cfe3f5; }
        .subtitle[hidden] { display: none; }
        label { display: block; margin-bottom: 12px; font-size: 14px; font-weight: 500; color: #ffffff; }
        label.section { font-size: 17px; font-weight: 600; margin-top: 24px; margin-bottom: 14px; }
        input {
            font-size: 18px;
            padding: 12px 14px;
            border-radius: 6px;
            border: 0;
            background: #ffffff;
            color: #012457;
            box-sizing: border-box;
            width: 100%;
            font-family: inherit;
            margin-bottom: 24px;
        }
        input::placeholder { color: #295b88aa; }
        input:focus { outline: 2px solid #ffcc00; outline-offset: 0; }
        select {
            font-size: 16px;
            padding: 10px 12px;
            border-radius: 6px;
            border: 0;
            background: #ffffff;
            color: #012457;
            box-sizing: border-box;
            width: 100%;
            font-family: inherit;
        }
        select:focus { outline: 2px solid #ffcc00; outline-offset: 0; }
        .activations { margin-bottom: 32px; }
        .activation-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .activation-row .name {
            flex: 0 0 150px;
            font-size: 13px;
            font-weight: 500;
        }
        .activation-row select { flex: 1; }
        button {
            cursor: pointer;
            background: #2c83d4;
            border: 0;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            padding: 14px 14px;
            border-radius: 99px;
            box-sizing: border-box;
            width: 100%;
            font-family: inherit;
            margin-top: 4px;
            transition: background-color 120ms ease;
        }
        button:hover { background: #1d77c9; }
        button:active { background: #0F6ACB; }
        .output {
            margin-top: 44px;
            padding: 12px;
            background: #295b88;
            border: 1px solid #ffcc00;
            border-radius: 6px;
            font-family: "Menlo", monospace;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 3px;
            text-align: center;
            min-height: 26px;
            user-select: all;
            word-break: break-all;
            color: #ffcc00;
        }
        .meta { margin-top: 14px; font-size: 13px; color: #ffffff; text-align: center; word-break: break-all; }
        .bad { color: #ffcc00; font-weight: 600; }
        .link { display: block; margin-top: 32px; text-align: center; font-size: 14px; }
        .link a { color: #ffcc00; text-decoration: none; font-weight: 500; }
        .link a:hover { text-decoration: underline; }
        .link + .link { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="header">
            <h1>Generate Key</h1>
            <button type="button" class="info-toggle" id="infoToggle" aria-expanded="false" aria-controls="subtitle" aria-label="About this tool" title="About this tool">i</button>
        </div>
        <p class="subtitle" id="subtitle" hidden>Two-way — encodes a 5-digit number + a username/email into a fixed-size key (e.g. IFKU-CAQ4-LJFA). The number always decodes back exactly; the username/email is only checkable, not recoverable.</p>
        <label class="section">Product activations</label>
        <div class="activations" id="activations"></div>
        <input id="number" type="hidden" />
        <label for="email">Username/Email</label>
        <input id="email" type="text" placeholder="Enter Username/Email" autocomplete="off" />
        <button id="generate">Generate Key</button>
        <div class="output" id="output">—</div>
        <div class="meta" id="meta"></div>
        <div class="link"><a href="validateKey.html">Validate a key →</a></div>
        <div class="link"><a href="decodeKey.html">Decode a key →</a></div>
    </div>

    <script>
        // Two-way (reversible) key scheme — a standalone tool, separate from
        // the one-way HMAC scheme in ../oneWay (and src/utils.js).
        //
        // Payload is fixed at 7 bytes, always producing exactly 12 base32
        // characters (3 dash groups of 4, e.g. IFKU-CAQ4-LJFA):
        //   bytes 0-2  5-digit number (0-99999), packed big-endian — this
        //              round-trips exactly, every time.
        //   bytes 3-6  a 32-bit fingerprint (FNV-1a) of the normalised
        //              email — NOT reversible. It only lets you check
        //              whether a *candidate* email matches; the email
        //              itself can't be read back from the key.
        // The 7 bytes are XORed with a keystream derived from
        // TWO_WAY_SECRET before base32 encoding (light obfuscation, not
        // real encryption). Keep this block identical across
        // generateKey.html, validateKey.html and decodeKey.html.
        const TWO_WAY_SECRET = "ndp3-key-v1-7a2c9f3e8d4b6105";
        const BASE32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
        const MAX_NUMBER = 99999;

        const normalizeEmail = (email) => String(email || "").trim().toLowerCase();

        const base32Encode = (bytes) => {
            let bits = 0, value = 0, out = "";
            for (const b of bytes) {
                value = (value << 8) | b;
                bits += 8;
                while (bits >= 5) {
                    out += BASE32[(value >> (bits - 5)) & 31];
                    bits -= 5;
                }
            }
            if (bits > 0) out += BASE32[(value << (5 - bits)) & 31];
            return out;
        };

        const secretBytes = new TextEncoder().encode(TWO_WAY_SECRET);
        const xor = (bytes) => bytes.map((b, i) => b ^ secretBytes[i % secretBytes.length]);

        const fnv1a32 = (bytes) => {
            let hash = 0x811c9dc5;
            for (const b of bytes) {
                hash ^= b;
                hash = Math.imul(hash, 0x01000193);
            }
            return hash >>> 0;
        };

        const packNumber = (num) => new Uint8Array([(num >>> 16) & 0xff, (num >>> 8) & 0xff, num & 0xff]);
        const packUint32 = (n) => new Uint8Array([(n >>> 24) & 0xff, (n >>> 16) & 0xff, (n >>> 8) & 0xff, n & 0xff]);

        const formatKey = (encoded) => (encoded.match(/.{1,4}/g) || []).join("-");

        const encodePayload = (numberStr, email) => {
            const num = parseInt(String(numberStr).trim(), 10);
            if (!Number.isInteger(num) || num < 0 || num > MAX_NUMBER) return null;
            const payload = new Uint8Array(7);
            payload.set(packNumber(num), 0);
            payload.set(packUint32(fnv1a32(new TextEncoder().encode(normalizeEmail(email)))), 3);
            return formatKey(base32Encode(xor(payload)));
        };

        // Each digit of the 5-digit code gates one product, left to right (see
        // src/constants/unlocks.js). Here each product gets a dropdown whose
        // selection is that digit: 0 locks the product, 1-5 unlock it for the
        // chosen duration.
        const PRODUCTS = [
            "Speech Builder",
            "Therapy Manual",
            "Speech Assessment",
            "Therapy Worksheets",
            "Articulograms",
        ];
        const DURATIONS = [
            { digit: 0, label: "Locked" },
            { digit: 1, label: "1 month" },
            { digit: 2, label: "3 month" },
            { digit: 3, label: "6 month" },
            { digit: 4, label: "12 month" },
            { digit: 5, label: "unlimited" },
        ];

        const infoToggle = document.getElementById("infoToggle");
        const subtitle = document.getElementById("subtitle");
        infoToggle.addEventListener("click", () => {
            const show = subtitle.hasAttribute("hidden");
            subtitle.toggleAttribute("hidden", !show);
            infoToggle.setAttribute("aria-expanded", String(show));
        });

        const activationsEl = document.getElementById("activations");
        const selects = PRODUCTS.map((name, i) => {
            const row = document.createElement("div");
            row.className = "activation-row";

            const label = document.createElement("span");
            label.className = "name";
            label.textContent = name;

            const select = document.createElement("select");
            for (const { digit, label: text } of DURATIONS) {
                const opt = document.createElement("option");
                opt.value = String(digit);
                opt.textContent = text;
                select.appendChild(opt);
            }
            row.append(label, select);
            activationsEl.appendChild(row);
            return select;
        });

        const currentCode = () => selects.map((s) => s.value).join("");

        document.getElementById("generate").addEventListener("click", () => {
            const numberVal = currentCode();
            const email = document.getElementById("email").value;
            const out = document.getElementById("output");
            const meta = document.getElementById("meta");

            document.getElementById("number").value = numberVal;

            if (!normalizeEmail(email)) {
                out.textContent = "—";
                meta.innerHTML = `<span class="bad">Enter a username or email</span>`;
                return;
            }
            if (numberVal === "00000") {
                out.textContent = "—";
                meta.innerHTML = `<span class="bad">Activate at least one product</span>`;
                return;
            }

            out.textContent = encodePayload(numberVal, email);
            meta.textContent = "";
        });
    </script>
</body>
</html>
