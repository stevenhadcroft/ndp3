<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Validate Key (Two-way)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            background: #011a3f;
            color: #ffffff;
            box-sizing: border-box;
        }
        .panel {
            background: #012457;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            width: 400px;
        }
        .header { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
        h1 { margin: 0; font-size: 22px; font-weight: 600; color: #ffffff; }
        .info-toggle {
            cursor: pointer;
            flex: 0 0 auto;
            width: 22px;
            height: 22px;
            margin: 0;
            padding: 0;
            border-radius: 50%;
            border: 1px solid #cfe3f5;
            background: transparent;
            color: #cfe3f5;
            font: 700 italic 14px Georgia, "Times New Roman", serif;
            line-height: 20px;
            text-align: center;
        }
        .info-toggle:hover { background: #295b88; }
        .info-toggle[aria-expanded="true"] { background: #ffcc00; border-color: #ffcc00; color: #012457; }
        .subtitle { margin: 0 0 32px; font-size: 13px; color: #cfe3f5; }
        .subtitle[hidden] { display: none; }
        label { display: block; margin-bottom: 12px; font-size: 14px; font-weight: 500; color: #ffffff; }
        input {
            font-size: 18px;
            padding: 12px 14px;
            border-radius: 6px;
            border: 0;
            background: #ffffff;
            color: #012457;
            box-sizing: border-box;
            width: 100%;
            font-family: inherit;
            margin-bottom: 24px;
        }
        input::placeholder { color: #295b88aa; }
        input:focus { outline: 2px solid #ffcc00; outline-offset: 0; }
        button {
            cursor: pointer;
            background: #2c83d4;
            border: 0;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            padding: 14px 14px;
            border-radius: 99px;
            box-sizing: border-box;
            width: 100%;
            font-family: inherit;
            margin-top: 8px;
            transition: background-color 120ms ease;
        }
        button:hover { background: #1d77c9; }
        button:active { background: #0F6ACB; }
        .output {
            margin-top: 44px;
            padding: 12px;
            background: #295b88;
            border: 1px solid #ffffff44;
            border-radius: 6px;
            font-family: "Menlo", monospace;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            text-align: center;
            min-height: 26px;
            word-break: break-all;
            color: #ffffff;
        }
        .ok { color: #44be06; font-weight: 700; }
        .bad { color: #ffcc00; font-weight: 700; }
        .meta { margin-top: 14px; font-size: 13px; color: #ffffff; text-align: center; word-break: break-all; }
        .meta .code { font-family: "Menlo", monospace; color: #ffcc00; letter-spacing: 1px; }
        .breakdown { margin-top: 20px; }
        .breakdown[hidden] { display: none; }
        .breakdown-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #ffffff22;
            font-size: 13px;
        }
        .breakdown-row:last-child { border-bottom: 0; }
        .breakdown-row .name { color: #cfe3f5; }
        .breakdown-row .value { font-weight: 600; }
        .breakdown-row .value.locked { color: #ffffff77; font-weight: 500; }
        .link { display: block; margin-top: 32px; text-align: center; font-size: 14px; }
        .link a { color: #ffcc00; text-decoration: none; font-weight: 500; }
        .link a:hover { text-decoration: underline; }
        .link + .link { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="header">
            <h1>Validate Key</h1>
            <button type="button" class="info-toggle" id="infoToggle" aria-expanded="false" aria-controls="subtitle" aria-label="About this tool" title="About this tool">i</button>
        </div>
        <p class="subtitle" id="subtitle" hidden>Two-way — decodes the number and checks the username/email against the key's fingerprint.</p>
        <label for="email">Username/Email</label>
        <input id="email" type="text" autocomplete="off" />
        <label for="key">Key</label>
        <input id="key" placeholder="XXXX-XXXX-XXXX" autocomplete="off" />
        <button id="validate">Validate</button>
        <div class="output" id="output">—</div>
        <div class="meta" id="meta"></div>
        <div class="breakdown" id="breakdown" hidden></div>
        <div class="link"><a href="generateKey.html">← Generate a key</a></div>
        <div class="link"><a href="decodeKey.html">Decode a key →</a></div>
    </div>

    <script>
        // Two-way (reversible) key scheme — a standalone tool, separate from
        // the one-way HMAC scheme in ../oneWay (and src/utils.js).
        //
        // Payload is fixed at 7 bytes, always exactly 12 base32 characters
        // (3 dash groups of 4, e.g. IFKU-CAQ4-LJFA):
        //   bytes 0-2  5-digit number (0-99999), packed big-endian — this
        //              round-trips exactly, every time.
        //   bytes 3-6  a 32-bit fingerprint (FNV-1a) of the normalised
        //              email — NOT reversible. It only lets you check
        //              whether a *candidate* email matches; the email
        //              itself can't be read back from the key.
        // The 7 bytes are XORed with a keystream derived from
        // TWO_WAY_SECRET before base32 encoding (light obfuscation, not
        // real encryption). Keep this block identical across
        // generateKey.html, validateKey.html and decodeKey.html.
        const TWO_WAY_SECRET = "ndp3-key-v1-7a2c9f3e8d4b6105";
        const BASE32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
        const MAX_NUMBER = 99999;
        const KEY_CHARS = 12; // 7 bytes of base32, always this many characters

        const normalizeEmail = (email) => String(email || "").trim().toLowerCase();

        const base32Decode = (str) => {
            const bytes = [];
            let bits = 0, value = 0;
            for (const ch of str.toUpperCase()) {
                const idx = BASE32.indexOf(ch);
                if (idx < 0) continue;
                value = (value << 5) | idx;
                bits += 5;
                if (bits >= 8) {
                    bytes.push((value >> (bits - 8)) & 0xff);
                    bits -= 8;
                }
            }
            return new Uint8Array(bytes);
        };

        const secretBytes = new TextEncoder().encode(TWO_WAY_SECRET);
        const xor = (bytes) => bytes.map((b, i) => b ^ secretBytes[i % secretBytes.length]);

        const fnv1a32 = (bytes) => {
            let hash = 0x811c9dc5;
            for (const b of bytes) {
                hash ^= b;
                hash = Math.imul(hash, 0x01000193);
            }
            return hash >>> 0;
        };

        const unpackNumber = (bytes) => (bytes[0] << 16) | (bytes[1] << 8) | bytes[2];
        const packUint32 = (n) => new Uint8Array([(n >>> 24) & 0xff, (n >>> 16) & 0xff, (n >>> 8) & 0xff, n & 0xff]);
        const toHex = (bytes) => Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("").toUpperCase();

        // Returns { number, emailFingerprint } or null if the key is the
        // wrong length or the decoded number is out of range — both strong
        // signs of a malformed/corrupted/wrong key (not a guarantee, since
        // there's no integrity tag, but a good sanity check).
        const decodeKeyPayload = (rawKey) => {
            const clean = String(rawKey || "").replace(/[^A-Za-z2-7]/g, "");
            if (clean.length !== KEY_CHARS) return null;
            const bytes = xor(base32Decode(clean));
            if (bytes.length !== 7) return null;
            const num = unpackNumber(bytes.subarray(0, 3));
            if (num > MAX_NUMBER) return null;
            return { number: String(num).padStart(5, "0"), emailFingerprint: toHex(bytes.subarray(3, 7)) };
        };

        const fingerprintOf = (email) => toHex(packUint32(fnv1a32(new TextEncoder().encode(normalizeEmail(email)))));

        // Each digit of the 5-digit code gates one product, left to right (see
        // src/constants/unlocks.js). Keep this in sync with generateKey.html.
        const PRODUCTS = [
            "Speech Builder",
            "Therapy Manual",
            "Speech Assessment",
            "Therapy Worksheets",
            "Articulograms",
        ];
        const DURATIONS = [
            { digit: 0, label: "Locked" },
            { digit: 1, label: "1 month" },
            { digit: 2, label: "3 month" },
            { digit: 3, label: "6 month" },
            { digit: 4, label: "12 month" },
            { digit: 5, label: "unlimited" },
        ];

        const breakdownEl = document.getElementById("breakdown");

        const renderBreakdown = (numberStr) => {
            if (!numberStr) {
                breakdownEl.hidden = true;
                breakdownEl.innerHTML = "";
                return;
            }
            const digits = numberStr.split("").map((d) => parseInt(d, 10));
            breakdownEl.innerHTML = PRODUCTS.map((name, i) => {
                const duration = DURATIONS[digits[i]] || DURATIONS[0];
                const locked = duration.digit === 0;
                return `<div class="breakdown-row"><span class="name">${name}</span><span class="value${locked ? " locked" : ""}">${duration.label}</span></div>`;
            }).join("");
            breakdownEl.hidden = false;
        };

        document.getElementById("validate").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const key = document.getElementById("key").value.trim();
            const out = document.getElementById("output");
            const meta = document.getElementById("meta");

            const decoded = decodeKeyPayload(key);
            const enteredEmail = normalizeEmail(email);
            const emailOk = !enteredEmail || (decoded && fingerprintOf(enteredEmail) === decoded.emailFingerprint);
            const ok = decoded !== null && emailOk;

            out.innerHTML = ok
                ? `<span class="ok">VALID</span>${decoded ? ` — number <span class="code">${decoded.number}</span>` : ""}`
                : `<span class="bad">INVALID</span>`;

            if (decoded === null) {
                meta.textContent = key ? "Key could not be decoded — malformed or corrupted." : "";
            } else if (enteredEmail && !emailOk) {
                meta.textContent = "Number decoded fine, but this username/email doesn't match the key's fingerprint.";
            } else if (enteredEmail) {
                meta.textContent = "Number and username/email fingerprint both match.";
            } else {
                meta.innerHTML = `Number decoded: <span class="code">${decoded.number}</span> (no username/email entered to check)`;
            }

            renderBreakdown(decoded ? decoded.number : null);
        });

        const infoToggle = document.getElementById("infoToggle");
        const subtitle = document.getElementById("subtitle");
        infoToggle.addEventListener("click", () => {
            const show = subtitle.hasAttribute("hidden");
            subtitle.toggleAttribute("hidden", !show);
            infoToggle.setAttribute("aria-expanded", String(show));
        });
    </script>
</body>
</html>
