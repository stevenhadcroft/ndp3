<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #012457;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        .logo {
            font-size: 32px;
            /* font-weight: bold; */
            margin-bottom: 20px;
            /* text-shadow: 2px 2px 4px rgba(0,0,0,0.3); */
        }

        .loading-text {
            font-size: 16px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .version {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo"><strong>NDP3</strong> Speech Builder</div>
        <div class="loading-text">Starting...</div>
        <div class="spinner"></div>
    </div>
    <div class="version">v2.0.1</div>
</body>
</html>
